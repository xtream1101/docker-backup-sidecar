# Working Test Example: PostgreSQL + MongoDB + Redis with Sample Data
#
# Quick Start:
# 1. Run: just up (or docker compose -f tests/docker-compose.example.yml up -d)
# 2. Wait for services to start (~10 seconds)
# 3. Run manual backup: just backup
# 4. Check backups: just list
#
# All configuration is inline - no .env file needed for testing!
# For automated testing: `just test` (see TESTING.md)

services:
  # PostgreSQL database with sample data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: testdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-test-postgres.sql:/docker-entrypoint-initdb.d/init-test-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MongoDB database with sample data
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass123
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongo-data:/data/db
      - ./init-test-mongo.js:/docker-entrypoint-initdb.d/init-test-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis with persistent data
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sample app that writes to a data directory
  app:
    image: alpine:3
    volumes:
      - app-data:/app/data
      - ./test-config.json:/app/config.json:ro
    command: >
      sh -c 'mkdir -p /app/data &&
             echo "Application started at $$(date)" > /app/data/app.log &&
             echo "Config file: $$(cat /app/config.json | head -1)" &&
             while true; do
               echo "$$(date): Application running, data files: $$(ls -la /app/data/ | wc -l)" >> /app/data/app.log;
               echo "Sample data line $$(date +%s)" >> /app/data/sample.txt;
               sleep 30;
             done'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Backup sidecar
  backup:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # Backup name (REQUIRED)
      BACKUP_NAME: docker-backup-sidecar-test
      # Restic repository (local for testing)
      RESTIC_REPOSITORY: /backups-local/docker-backup-sidecar-test
      # Restic password
      RESTIC_PASSWORD: test-restic-password-change-in-production
      # PostgreSQL connection
      BACKUP_POSTGRES: postgresql://testuser:testpass123@postgres:5432/testdb
      # MongoDB connection
      BACKUP_MONGODB: mongodb://testuser:testpass123@mongo:27017/testdb?authSource=admin
      # Redis connection
      BACKUP_REDIS: redis://redis:6379
      # Where Redis data is mounted in this container
      BACKUP_REDIS_DATA_DIR: /redis-data
      # Directories to backup
      BACKUP_DIRS: /app/data
      # Individual files to backup
      BACKUP_FILES: /app/config.json:app-config
      # Retention policy
      RESTIC_KEEP_LAST: 14
      RESTIC_KEEP_DAILY: 7
      RESTIC_KEEP_WEEKLY: 4
      RESTIC_KEEP_MONTHLY: 0
      RESTIC_KEEP_YEARLY: 0
      # Timezone
      TZ: America/New_York
    volumes:
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # App data to backup (read-only)
      - app-data:/app/data:ro
      # Directly mounted file to backup (read-only)
      - ./test-config.json:/app/config.json:ro
      # Redis data directory (read-only for backup, restic needs to read the RDB)
      - redis-data:/redis-data:ro
      # Local backup storage (restic repo lives here)
      - ./test-backups:/backups-local
      # Restic cache (speeds up repeated operations)
      - restic-cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  app-data:
  postgres-data:
  mongo-data:
  redis-data:
  restic-cache:
